<!-- TEMPLATE 01 — BIG STAT
     ONE dominant idea: the figure. Everything else supports it.
     Reading order: figure → deck → data bar → context strip → brand.
     Depth: grid + glow ground · cropped rings · foreground marks and rails. -->
<style>
  .frame{padding:{{margin}}px;}

  .topbar{display:flex;align-items:center;gap:22px;flex:none;}
  .topbar s{text-decoration:none;flex:1;height:1px;background:var(--structure);opacity:.38;}
  .topbar .label{flex:none;opacity:.66;}

  .statblock{margin-top:{{stat_top}}px;flex:none;}
  .focal{font-size:{{focal_size}}px;display:inline-block;}
  .focal--word{white-space:normal;line-height:.9;letter-spacing:-.035em;
               font-size:{{focal_word_size}}px;max-width:10ch;display:block;}
  /* The symbol sits on the numeral's cap line, not its baseline. */
  .focal .sym{vertical-align:top;line-height:1.16;font-size:.26em;margin-left:.05em;}

  .unitline{display:flex;align-items:center;gap:16px;margin-top:4px;}
  .unitline .u{font-family:var(--body);font-weight:500;font-size:38px;letter-spacing:.26em;
               text-transform:uppercase;color:var(--accent);}
  .unitline s{text-decoration:none;flex:1;height:1px;background:var(--accent);opacity:.4;max-width:300px;}

  .deck{margin-top:{{deck_top}}px;max-width:{{deck_measure}}ch;font-size:{{deck_size}}px;}
  .sched{width:100%;}

  /* ---- data row: supports the figure, never competes with it -------------- */
  .datarow{margin-bottom:{{data_bottom}}px;flex:none;width:100%;}
  .bar{display:flex;height:22px;width:100%;}
  .bar .fill{background:var(--accent);flex:0 0 {{prop_pct}}%;}
  .bar .rest{background:var(--structure);opacity:.28;flex:1 1 auto;}
  .barmark{position:relative;height:13px;}
  .barmark i{position:absolute;top:0;left:{{prop_pct}}%;width:1px;height:13px;background:var(--accent);}
  .barkey{display:flex;justify-content:space-between;margin-top:11px;}
  .barkey span{
    font-family:var(--body);font-weight:500;font-size:25px;letter-spacing:.13em;
    text-transform:uppercase;white-space:nowrap;
  }
  .barkey .a{color:var(--accent);}
  .barkey .b{color:var(--muted);opacity:.66;}

  /* Non-share figures get a schematic instead: three marks on a rule, with the
     note set beside it rather than beneath — stacking the two cost this variant
     130px it did not have. */
  .schedrow{display:flex;align-items:center;gap:40px;}
  .sched{flex:1 1 auto;min-width:0;}
  .schednote{flex:0 0 34%;font-family:var(--body);font-weight:300;font-size:27px;
             line-height:1.36;color:var(--muted);opacity:.85;}

  /* ---- bottom band ---- */
  /* The lower third is a designed band, not leftover navy. It bleeds to both
     edges so the composition reads as a system, not a floating column. */
  .band{
    flex:none;position:relative;
    margin:0 -{{margin}}px -{{margin}}px;
    padding:30px {{margin}}px 28px;
    background:var(--raised);
    border-top:1px solid var(--edge);
  }
  .band::before{
    content:"";position:absolute;top:-1px;left:{{margin}}px;width:118px;height:2px;
    background:var(--accent);
  }
  .strip{display:flex;align-items:flex-end;gap:{{strip_gap}}px;padding-bottom:24px;}
  .strip .cell{display:flex;flex-direction:column;gap:9px;}
  .strip .cell + .cell{border-left:1px solid var(--edge);padding-left:{{strip_gap}}px;}
  .strip .cell .k{font-family:var(--body);font-weight:500;font-size:25px;letter-spacing:.16em;
                  text-transform:uppercase;color:var(--muted);opacity:.68;}
  .strip .cell .v{font-family:var(--display);font-weight:400;font-size:33px;color:var(--fg);
                  letter-spacing:-.005em;}
  .strip .cell .v em{font-style:normal;color:var(--accent);}
  .footer{padding-top:24px;border-top:1px solid var(--edge);}
</style>

<div class="stage">
  {{> wash}}

  <div class="frame">
    <div class="topbar">
      <div class="eyebrow">{{eyebrow}}</div>
      <s></s>
    </div>

    <div class="statblock">
      <span class="focal {{focal_class}}" data-fit data-max="{{focal_size_max}}" data-min="{{focal_size_min}}">{{focal}}{{#focal_symbol}}<span class="sym">{{focal_symbol}}</span>{{/focal_symbol}}</span>
      {{#focal_unit}}<div class="unitline"><span class="u">{{focal_unit}}</span><s></s></div>{{/focal_unit}}
    </div>

    <p class="deck" data-fit data-max="{{deck_size}}" data-min="{{deck_min}}">{{{deck_html}}}</p>

    <div class="spacer"></div>

    <div class="datarow">
      {{#proportion}}
        <div class="barmark"><i></i></div>
        <div class="bar"><div class="fill"></div><div class="rest"></div></div>
        <div class="barkey"><span class="a">{{prop_label_a}}</span><span class="b">{{prop_label_b}}</span></div>
      {{/proportion}}
      {{^proportion}}
        <div class="schedrow">
        <svg class="sched" viewBox="0 0 620 54" fill="none" aria-hidden="true">
          <path d="M2 27 L618 27" stroke="var(--structure)" stroke-width="1.5" opacity=".55"/>
          <path d="M2 27 L214 27" stroke="var(--accent)" stroke-width="2.5"/>
          <g fill="var(--accent)"><circle cx="2" cy="27" r="6"/><circle cx="214" cy="27" r="6"/></g>
          <g fill="var(--structure)" opacity=".8"><circle cx="416" cy="27" r="5"/><circle cx="616" cy="27" r="5"/></g>
          <g stroke="var(--structure)" stroke-width="1" opacity=".45">
            <path d="M214 8 L214 46"/><path d="M416 12 L416 42"/>
          </g>
        </svg>
        <div class="schednote">{{frag_note}}</div>
        </div>
      {{/proportion}}
    </div>

    {{> band}}

    <div class="corner corner--tr"></div>
    <div class="corner corner--bl"></div>
  </div>
</div>
