# THE SAMPLE FRAME. Which companies stand for which cell, and why.
#
# **This file is the study design, and it is the thing most likely to be wrong.** A company filed
# in the wrong cell does not fail loudly; it quietly moves that cell's numbers and every
# conclusion drawn from them. So each entry names WHY it represents its cell, and the whole list
# is reviewed by a human before a single credit is spent.
#
# Axes, and a fourth set of attributes that turned out to matter as much as the first three:
#
#   offering   saas | service | product          what you sell
#   motion     plg | pls | slg | enterprise      how it gets bought
#   stage      early | growth | scaled           roughly: <50, 50-500, 500+ people
#   buyer      practitioner | manager | exec | procurement
#   market     global | regional                 a measured 2x difference by market exists
#   regulated  true | false                      changes claim discipline, not just tone
#
# **Two cells are close to structurally empty and are recorded as such rather than forced.**
# Service sold PLG barely exists: you cannot self-serve a consultancy. Product sold PLG exists
# only where the hardware is cheap enough to buy on a card. Filling them with bad examples would
# be worse than reporting them empty.
#
# `slug` is the LinkedIn company slug. Wrong slugs return nothing rather than erroring, so the
# scraper reports every URL that came back empty and that report is part of the result.

meta:
  designed: 2026-09-12
  method: >-
    Measured first. What these companies actually published on LinkedIn, classified by the
    engine's own buying-job classifier, is the evidence. Published agency and vendor advice is
    gathered separately, graded, and used as hypotheses to test rather than as conclusions.
  posts_per_company: 50
  minimum_per_cell: 3
  status: APPROVED 2026-09-12. Peak Design struck on review as consumer-adjacent,
    which would have put a non-B2B voice into a product cell.

companies:

  # ============================================================================================
  # SaaS x PLG. The case most published content advice is written for, which is exactly why it
  # needs measuring rather than assuming.
  # ============================================================================================
