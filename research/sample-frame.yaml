     buyer: practitioner, market: global, regulated: false,
     why: "design tool adopted bottom-up by individual designers before any contract exists"}
  - {name: Notion, slug: notionhq, offering: saas, motion: plg, stage: scaled,
     buyer: practitioner, market: global, regulated: false,
     why: "personal use first, team plan later. The canonical self-serve expansion path"}
  - {name: Linear, slug: linearapp, offering: saas, motion: plg, stage: growth,
