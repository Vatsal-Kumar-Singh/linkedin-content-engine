empty_cells:
  - cell: service x plg
    why: >-
      You cannot self-serve a consultancy. Where something looks like it, the product has stopped
      being a service. Reported as structurally empty rather than padded with a productised
      agency that is really SaaS.
  - cell: service x early, at any motion beyond the two sampled
    why: >-
      Early service businesses are typically one or two named people whose LinkedIn IS the
      company channel, so the company page carries almost nothing and the sample would measure
      an empty page rather than a strategy. Kalungi is included as the closest usable case.
